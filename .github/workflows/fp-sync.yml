name: fp-sync

# Weekly refresh of config/oui.csv from the IEEE registries, as a pull request.
on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install httpx
      - run: python scripts/sync_oui.py
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/oui-sync
          commit-message: "chore: refresh IEEE OUI registry"
          title: "chore: refresh IEEE OUI registry"
          body: Automated weekly refresh of `config/oui.csv` from standards-oui.ieee.org.
          add-paths: config/oui.csv
          delete-branch: true

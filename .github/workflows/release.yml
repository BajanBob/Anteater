name: release

# Push a tag like v0.1.0 to build standalone executables and publish a release:
#   Linux:   anteater-linux-x86_64 (single binary) and Anteater-x86_64.AppImage
#   Windows: anteater-windows-x64.exe and an installer
#   macOS:   anteater-macos-arm64
#   any OS with Python: anteater.pyz
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04      # older glibc = runs on more distros
            name: linux-x86_64
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libfuse2

      - name: install
        run: python -m pip install -e ".[dev,alerts]"

      # Ship a current IEEE registry. If the IEEE site is down, build with the committed copy.
      - name: refresh OUI registry
        shell: bash
        run: python scripts/sync_oui.py || echo "::warning::OUI sync failed; using the committed config/oui.csv"

      - name: build executable
        run: python -m PyInstaller --noconfirm --clean build/anteater.spec

      - name: smoke test
        shell: bash
        run: |
          exe=dist/anteater; [[ "$RUNNER_OS" == "Windows" ]] && exe=dist/anteater.exe
          "$exe" version
          "$exe" selftest --no-radio

      - name: package (Linux)
        if: runner.os == 'Linux'
        run: |
          mv dist/anteater dist/anteater-${{ matrix.name }}
          bash build/linux/make_appimage.sh dist/anteater-${{ matrix.name }}

      - name: package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d') { $version = "0.1.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" build\windows\installer.iss
          Move-Item dist\anteater.exe dist\anteater-${{ matrix.name }}.exe

      - name: package (macOS)
        if: runner.os == 'macOS'
        run: mv dist/anteater dist/anteater-${{ matrix.name }}

      - uses: actions/upload-artifact@v7
        with:
          name: anteater-${{ matrix.name }}
          path: |
            dist/anteater-*
            dist/Anteater-*.AppImage
            dist/AnteaterSetup-*.exe
          if-no-files-found: error

  pyz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install httpx
      - name: refresh OUI registry
        run: python scripts/sync_oui.py || echo "::warning::OUI sync failed; using the committed config/oui.csv"
      - run: python scripts/build_pyz.py
      - uses: actions/upload-artifact@v7
        with:
          name: anteater-pyz
          path: dist/anteater.pyz

  publish:
    needs: [build, pyz]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: checksums
        run: cd artifacts && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true

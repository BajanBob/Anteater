# Kismet site config for Anteater. Kismet reads kismet_site.conf last, so these
# lines override its defaults. Copy or symlink it into Kismet's config dir:
#   sudo ln -s "$PWD/config/kismet_site.conf" /etc/kismet/kismet_site.conf
# Adjust interface names: `ip link` (Wi-Fi), `hciconfig` (Bluetooth).

# Only this machine can reach the Kismet web UI and REST API
httpd_bind_address=127.0.0.1
httpd_port=2501

# Wi-Fi: one radio on the three main 2.4 GHz channels, one hopping 5 GHz
source=wlan1:name=wifi24,channels="1,6,11",channel_hoprate=5/sec
source=wlan2:name=wifi5,channels="36,40,44,48,52,56,60,64,100,104,108,112,116,120,124,128,132,136,140,144,149,153,157,161,165",channel_hoprate=5/sec

# Bluetooth classic + LE from the host adapter
source=hci0:name=bt

# Position from gpsd (same daemon anteater reads)
gps=gpsd:host=localhost,port=2947

# Anteater keeps its own database; keep Kismet's log small
log_types=kismet
log_prefix=/var/log/kismet/


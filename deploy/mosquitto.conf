# Mosquitto 2.x config for Anteater (mounted by docker-compose.yml).
# The container ports are published on 127.0.0.1 only, so anonymous access
# here is reachable from this machine alone. If you expose the broker any
# wider, set allow_anonymous false and add a password_file.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# Plain MQTT, used by `anteater` and termite
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# MQTT over websockets, for browser dashboards
listener 9001 0.0.0.0
protocol websockets

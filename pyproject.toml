[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anteater"
version = "0.1.0"
description = "Passive RF surveillance detection: SSID anomalies, tracker following, fake 2G towers, ALPR, drones"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["rf", "kismet", "sdr", "wifi", "ble", "surveillance", "privacy", "alpr", "imsi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Communications :: Ham Radio",
]
dependencies = [
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.7",
  "websockets>=12",
  "httpx>=0.27",
  "orjson>=3.10",
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "paho-mqtt>=2.1",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Audio motifs and the 1080p HUD clips. TTS uses the espeak-ng binary if present.
alerts = ["opencv-python>=4.10", "sounddevice>=0.4.6"]
# QUBO dwell planner. termite has a built-in annealer, so this is optional.
# SoapySDR is NOT on PyPI: install it from your OS packages, e.g.
#   apt install python3-soapysdr soapysdr-module-rtlsdr soapysdr-module-hackrf
termite = [
  "dimod>=0.12",
  "dwave-samplers>=1.2",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "pyinstaller>=6.8",
  "pre-commit>=3.7",
]

[project.scripts]
anteater = "anteater.cli:app"
termite = "termite.cli:app"

[project.urls]
Homepage = "https://github.com/USER/anteater"
Issues = "https://github.com/USER/anteater/issues"

[tool.hatch.build.targets.wheel]
packages = ["anteater", "termite"]

# Ship the band plans, signatures and UI inside the wheel
[tool.hatch.build.targets.wheel.force-include]
"config/vendors" = "anteater/_data/vendors"
"config/spectrum" = "anteater/_data/spectrum"
"config/oui.csv" = "anteater/_data/oui.csv"
"ui" = "anteater/_data/ui"
"alembic" = "anteater/_data/alembic"

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",   # formatter owns line length
  "B008",   # typer uses calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
exclude = ["build/", "dist/"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "radio: needs real RF hardware",
  "sdr: needs SoapySDR",
  "db: needs SQLAlchemy and aiosqlite",
]

# -------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["anteater", "termite"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
